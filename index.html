<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Matrícula UNAD Premium</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unad: {
                            blue: '#002F6C',
                            navy: '#001E44',
                            yellow: '#F2B705',
                            gold: '#D19A02',
                            lightBlue: '#E6F0FA',
                            sky: '#0070F3'
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .font-title {
            font-family: 'Outfit', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Custom print styling */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
                color: black;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #e2e8f0 !important;
                background: white !important;
                color: black !important;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased selection:bg-unad-yellow selection:text-unad-blue">
    <div id="root"></div>
    
    <!-- React UMD libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        const SimuladorMatricula = () => {
          const [tipoPrograma, setTipoPrograma] = useState('pregrado');
          const [creditos, setCreditos] = useState(15);
          const [descuentos, setDescuentos] = useState({
            electoral: false,
            convenio: 0
          });
          const [checklistDocs, setChecklistDocs] = useState({});
          const [copySuccess, setCopySuccess] = useState(false);
          const [activeFaq, setActiveFaq] = useState(null);
          const programas = {
            tecnologia: {
              nombre: 'Tecnologías',
              nivel: 'pregrado',
              creditoValor: 152000,
              inscripcion: 245000,
              seguro: 10000,
              creditosDefault: 15,
              maxCreditos: 18,
              minCreditos: 1,
              icon: (
                <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              ),
              desc: 'Programas de formación tecnológica superior.'
            },
            pregrado: {
              nombre: 'Profesional (Pregrados)',
              nivel: 'pregrado',
              creditoValor: 170000,
              inscripcion: 245000,
              seguro: 10000,
              creditosDefault: 15,
              maxCreditos: 21,
              minCreditos: 1,
              icon: (
                <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
              ),
              desc: 'Carreras profesionales universitarias universitarias.'
            },
            especializacion: {
              nombre: 'Especializaciones',
              nivel: 'posgrado',
              creditoValor: 598000,
              inscripcion: 390000,
              seguro: 10000,
              creditosDefault: 12,
              maxCreditos: 15,
              minCreditos: 1,
              icon: (
                <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 14l9-5-9-5-9 5 9 5z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 14v7" />
                </svg>
              ),
              desc: 'Posgrados de especialización profesional.'
            },
            maestria: {
              nombre: 'Maestrías',
              nivel: 'posgrado',
              creditoValor: 925000,
              inscripcion: 390000,
              seguro: 10000,
              creditosDefault: 12,
              maxCreditos: 12,
              minCreditos: 1,
              icon: (
                <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" />
                </svg>
              ),
              desc: 'Estudios avanzados de maestría.'
            },
            doctorado: {
              nombre: 'Doctorado',
              nivel: 'posgrado',
              creditoValor: 1032000,
              inscripcion: 390000,
              seguro: 10000,
              creditosDefault: 12,
              maxCreditos: 12,
              minCreditos: 1,
              icon: (
                <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.504-1.125-1.125-1.125h-6.75a1.125 1.125 0 00-1.125 1.125v3.375m9 0h-9M9 6h6m-6 3h6m-6 3h6m-9-6a3 3 0 013-3h12a3 3 0 013 3v12a3 3 0 01-3 3H6a3 3 0 01-3-3V6z" />
                </svg>
              ),
              desc: 'Programas de doctorado en investigación.'
            }
          };
          const requisitos = {
            pregrado: [
              { id: 'dip', text: 'Copia del Diploma de Bachiller' },
              { id: 'act', text: 'Copia del Acta de grado de bachiller autenticada' },
              { id: 'icf', text: 'Resultado de Pruebas Saber 11 (ICFES)' },
              { id: 'doc', text: 'Documento de identidad legible y ampliado al 150%' },
              { id: 'fot', text: '2 fotos 3x4 fondo blanco en formato físico/digital' },
              { id: 'des', text: 'Soportes de descuento original (si aplica electoral o convenio)' }
            ],
            posgrado: [
              { id: 'dipp', text: 'Fotocopia del Diploma de Pregrado' },
              { id: 'actp', text: 'Fotocopia del Acta de Grado de Pregrado (autenticada)' },
              { id: 'hv', text: 'Hoja de vida actualizada' },
              { id: 'docp', text: 'Fotocopia del Documento de Identidad ampliado al 150%' },
              { id: 'fotp', text: 'Dos (2) fotos 3×4 fondo blanco' },
              { id: 'desp', text: 'Soportes de descuento (si aplica certificado electoral o de egresado)' }
            ]
          };
          const faqs = [
            {
              q: '¿Cómo se aplican y acumulan los descuentos?',
              a: 'El descuento electoral (10%) y los convenios interinstitucionales son acumulables directamente (sumando sus porcentajes). Por ejemplo, si tienes derecho al 10% electoral y un 15% de convenio de alcaldía, obtendrás un 25% de descuento total sobre el valor del crédito académico.'
            },
            {
              q: '¿Qué es el descuento electoral y qué vigencia tiene?',
              a: 'Es un beneficio del 10% que se otorga por haber ejercido el derecho al voto. Para este periodo, se exige el certificado electoral de las últimas votaciones nacionales vigentes (29 de octubre de 2023).'
            },
            {
              q: '¿El descuento aplica sobre la inscripción y el seguro?',
              a: 'No, los descuentos se aplican de forma exclusiva sobre el costo de los créditos académicos solicitados. Los costos de inscripción y seguro estudiantil se cobran en su totalidad.'
            },
            {
              q: '¿Cuáles son las opciones de financiación que ofrece la UNAD?',
              a: 'La UNAD cuenta con convenios de financiación directa, alianzas con el ICETEX, cooperativas como Cooptraiss, Fincomercio, Banco Pichincha, y pagos con tarjeta de crédito de cualquier entidad bancaria.'
            }
          ];
          // Reset creditos & checklist when program changes
          useEffect(() => {
            if (tipoPrograma && programas[tipoPrograma]) {
              setCreditos(programas[tipoPrograma].creditosDefault);
              setChecklistDocs({});
            }
          }, [tipoPrograma]);
          // Adapt military discount depending on level
          useEffect(() => {
            const esPos = programas[tipoPrograma].nivel === 'posgrado';
            // If the selected discount is 40% (pregrado military) but now we are on posgrado, transition to 25% (posgrado military)
            if (esPos && descuentos.convenio === 40) {
              setDescuentos(d => ({ ...d, convenio: 25 }));
            }
            // If selected is 30% (egresado) or 25% (posgrado military) but we change to pregrado, reset or transition to 40%
            if (!esPos && (descuentos.convenio === 30 || descuentos.convenio === 25)) {
              setDescuentos(d => ({ ...d, convenio: 0 }));
            }
          }, [tipoPrograma, descuentos.convenio]);
          const calcularMatricula = () => {
            if (!tipoPrograma || !programas[tipoPrograma]) {
              return {
                subtotalCreditos: 0,
                inscripcion: 0,
                seguro: 0,
                subtotal: 0,
                descuentoAplicado: 0,
                porcentajeDescuento: 0,
                descuentosAplicados: [],
                total: 0
              };
            }
            const programa = programas[tipoPrograma];
            const subtotalCreditos = creditos * programa.creditoValor;
            const subtotal = subtotalCreditos + programa.inscripcion + programa.seguro;
            
            let descuentoTotal = 0;
            let descuentosAplicados = [];
            
            // Certificado electoral (10%)
            if (descuentos.electoral) {
              descuentoTotal += 10;
              descuentosAplicados.push('🗳️ Electoral 10%');
            }
            
            // Descuentos por convenio
            if (descuentos.convenio > 0) {
              descuentoTotal += descuentos.convenio;
              if (descuentos.convenio === 30) {
                descuentosAplicados.push('🎓 Egresado UNAD 30%');
              } else if (descuentos.convenio === 25) {
                descuentosAplicados.push('🎖️ Militar Activo 25%');
              } else if (descuentos.convenio === 40) {
                descuentosAplicados.push('🎖️ Militar Activo 40%');
              } else {
                descuentosAplicados.push(`📋 Convenio ${descuentos.convenio}%`);
              }
            }
            
            const descuentoAplicado = (subtotalCreditos * descuentoTotal) / 100;
            const total = subtotal - descuentoAplicado;
            
            return {
              subtotalCreditos,
              inscripcion: programa.inscripcion,
              seguro: programa.seguro,
              subtotal,
              descuentoAplicado,
              porcentajeDescuento: descuentoTotal,
              descuentosAplicados,
              total
            };
          };
          const resultado = calcularMatricula();
          const programaActual = programas[tipoPrograma];
          const esPosgrado = programaActual.nivel === 'posgrado';
          const listaRequisitos = esPosgrado ? requisitos.posgrado : requisitos.pregrado;
          
          const docsCheckedCount = Object.values(checklistDocs).filter(Boolean).length;
          const pctDocs = Math.round((docsCheckedCount / listaRequisitos.length) * 100) || 0;
          const handleChecklistChange = (id) => {
            setChecklistDocs(prev => ({
              ...prev,
              [id]: !prev[id]
            }));
          };
          const handleCopySummary = () => {
            const resumenText = `--- SIMULACIÓN MATRÍCULA UNAD ---
Programa: ${programaActual.nombre}
Créditos Académicos: ${creditos} ($${(creditos * programaActual.creditoValor).toLocaleString()} COP)
Inscripción: $${resultado.inscripcion.toLocaleString()} COP
Seguro Estudiantil: $${resultado.seguro.toLocaleString()} COP
Descuento Aplicado: ${resultado.porcentajeDescuento}% (-$${resultado.descuentoAplicado.toLocaleString()} COP)
Descuentos detallados: ${resultado.descuentosAplicados.join(' + ') || 'Ninguno'}
---------------------------------
VALOR TOTAL A PAGAR: $${resultado.total.toLocaleString()} COP
Simulado el ${new Date().toLocaleDateString()}
---------------------------------`;
            navigator.clipboard.writeText(resumenText).then(() => {
              setCopySuccess(true);
              setTimeout(() => setCopySuccess(false), 3000);
            });
          };
          const handlePrint = () => {
            window.print();
          };
          const handleReset = () => {
            setTipoPrograma('pregrado');
            setCreditos(15);
            setDescuentos({ electoral: false, convenio: 0 });
            setChecklistDocs({});
          };
          // Calculated proportions for visual chart
          const creditsPct = resultado.subtotalCreditos > 0 ? (resultado.subtotalCreditos / (resultado.subtotalCreditos + resultado.inscripcion + resultado.seguro)) * 100 : 0;
          const feesPct = 100 - creditsPct;
          return (
            <div className="min-h-screen flex flex-col font-inter">
              {/* Top Decorative bar */}
              <div className="h-2 bg-gradient-to-r from-unad-blue via-unad-yellow to-yellow-500 w-full no-print"></div>
              {/* Navigation Header */}
              <header className="bg-unad-blue text-white shadow-lg py-5 px-4 sm:px-8 no-print transition-all duration-300">
                <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <div className="bg-white/10 p-3 rounded-2xl border border-white/20 backdrop-blur-md shadow-inner">
                      <svg className="w-10 h-10 text-unad-yellow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                      </svg>
                    </div>
                    <div>
                      <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight font-title text-white flex items-center gap-2">
                        UNAD <span className="text-unad-yellow font-medium text-lg sm:text-xl px-2 py-0.5 rounded-lg bg-white/10 border border-white/10">Simulador</span>
                      </h1>
                      <p className="text-xs sm:text-sm text-slate-300 font-light mt-0.5">
                        Liquidación oficial proyectada de Matrícula Universitaria
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <button
                      onClick={handleReset}
                      className="px-4 py-2 text-xs font-semibold rounded-xl text-slate-200 bg-white/5 border border-white/10 hover:bg-white/10 transition duration-200"
                    >
                      Reiniciar valores
                    </button>
                    <a
                      href="https://www.unad.edu.co"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-4 py-2 text-xs font-semibold rounded-xl text-unad-blue bg-unad-yellow hover:bg-yellow-400 shadow-md hover:shadow-unad-yellow/20 transition duration-200"
                    >
                      Ir al Sitio UNAD
                    </a>
                  </div>
                </div>
              </header>
              {/* Main Content Area */}
              <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
                {/* Print Title Header (Only visible when printing) */}
                <div className="hidden print:block col-span-12 border-b-2 border-unad-blue pb-4 mb-6">
                  <h1 className="text-3xl font-bold text-unad-blue">UNIVERSIDAD NACIONAL ABIERTA Y A DISTANCIA (UNAD)</h1>
                  <p className="text-md text-slate-600">Simulación Proyectada de Matrícula Universitaria</p>
                  <p className="text-sm text-slate-500 mt-1">Fecha de liquidación: {new Date().toLocaleDateString()} a las {new Date().toLocaleTimeString()}</p>
                </div>
                {/* Left Column: Inputs & Customizer (8 Cols on large screen) */}
                <div className="lg:col-span-7 space-y-6 sm:space-y-8 no-print">
                  {/* Step 1: Program Selector */}
                  <section className="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/80 hover:border-slate-300 transition duration-200">
                    <h2 className="text-lg sm:text-xl font-bold font-title text-unad-blue mb-4 flex items-center gap-2">
                      <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-unad-blue/5 text-unad-blue text-sm">1</span>
                      Selecciona tu Programa Académico
                    </h2>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      {Object.entries(programas).map(([key, prog]) => {
                        const isSelected = tipoPrograma === key;
                        return (
                          <button
                            key={key}
                            onClick={() => setTipoPrograma(key)}
                            className={`p-4 rounded-2xl border text-left flex items-start gap-4 transition-all duration-300 ${
                              isSelected
                                ? 'border-unad-blue bg-blue-50/50 shadow-md ring-2 ring-unad-blue/20'
                                : 'border-slate-200 hover:border-blue-200 hover:bg-slate-50/50 hover:shadow-sm'
                            }`}
                          >
                            <div className={`p-2.5 rounded-xl transition duration-300 ${
                              isSelected ? 'bg-unad-blue text-white shadow-md' : 'bg-slate-100 text-slate-500'
                            }`}>
                              {prog.icon}
                            </div>
                            <div className="flex-1 min-w-0">
                              <h3 className={`font-semibold text-sm sm:text-base leading-snug truncate ${
                                isSelected ? 'text-unad-blue' : 'text-slate-800'
                              }`}>
                                {prog.nombre}
                              </h3>
                              <p className="text-xs text-slate-500 mt-0.5 line-clamp-1">
                                {prog.desc}
                              </p>
                              <div className="mt-2 flex items-center justify-between">
                                <span className={`text-xs font-bold ${isSelected ? 'text-unad-blue' : 'text-slate-600'}`}>
                                  ${prog.creditoValor.toLocaleString()} <span className="font-normal text-slate-400">/ cr.</span>
                                </span>
                                {isSelected && (
                                  <span className="text-[10px] uppercase font-bold tracking-wider text-unad-blue bg-unad-lightBlue px-2 py-0.5 rounded-full">
                                    Activo
                                  </span>
                                )}
                              </div>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </section>
                  {/* Step 2: Academic Credits Slider */}
                  <section className="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/80 hover:border-slate-300 transition duration-200">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                      <h2 className="text-lg sm:text-xl font-bold font-title text-unad-blue flex items-center gap-2">
                        <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-unad-blue/5 text-unad-blue text-sm">2</span>
                        Cantidad de Créditos Académicos
                      </h2>
                      <div className="flex items-center gap-2 self-start sm:self-auto">
                        <span className="text-xs text-slate-500 font-medium">Créditos:</span>
                        <input
                          type="number"
                          value={creditos}
                          onChange={(e) => {
                            const val = parseInt(e.target.value) || 0;
                            if (val >= 0 && val <= 35) setCreditos(val);
                          }}
                          className="w-16 p-1.5 font-bold text-center border-2 border-slate-200 rounded-lg focus:border-unad-blue focus:outline-none focus:ring-1 focus:ring-unad-blue/20 text-sm text-unad-blue"
                          min="0"
                          max="35"
                        />
                      </div>
                    </div>
                    <p className="text-xs text-slate-500 leading-relaxed mb-4">
                      Cada asignatura equivale a un número de créditos (usualmente entre 2 y 4 créditos). La UNAD permite inscribir desde {programaActual.minCreditos} hasta {programaActual.maxCreditos} créditos por período académico regular.
                    </p>
                    <div className="space-y-3">
                      <input
                        type="range"
                        min={programaActual.minCreditos}
                        max={programaActual.maxCreditos}
                        value={creditos}
                        onChange={(e) => setCreditos(parseInt(e.target.value) || 1)}
                        className="w-full h-2.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-unad-blue"
                      />
                      <div className="flex justify-between text-xs text-slate-400 font-medium px-1">
                        <span>Min: {programaActual.minCreditos} cr.</span>
                        <span className="text-unad-blue font-semibold bg-unad-lightBlue px-2.5 py-0.5 rounded-full">Recomendado: {programaActual.creditosDefault} cr.</span>
                        <span>Máx: {programaActual.maxCreditos} cr.</span>
                      </div>
                    </div>
                  </section>
                  {/* Step 3: Discounts Options */}
                  <section className="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/80 hover:border-slate-300 transition duration-200">
                    <h2 className="text-lg sm:text-xl font-bold font-title text-unad-blue mb-2 flex items-center gap-2">
                      <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-unad-blue/5 text-unad-blue text-sm">3</span>
                      Descuentos y Beneficios
                    </h2>
                    <p className="text-xs text-slate-500 mb-5 leading-relaxed">
                      La UNAD incentiva la participación y el acceso a la educación. Los descuentos del certificado electoral y los convenios interinstitucionales se suman.
                    </p>
                    <div className="space-y-4">
                      {/* Sub-section: Electoral Discount */}
                      <div className="p-4 rounded-2xl border border-slate-200/80 bg-slate-50/50">
                        <div className="flex items-start justify-between gap-4">
                          <div className="flex items-start gap-3">
                            <span className="text-2xl mt-0.5">🗳️</span>
                            <div>
                              <h3 className="font-semibold text-slate-800 text-sm sm:text-base">
                                Certificado Electoral Vigente
                              </h3>
                              <p className="text-xs text-slate-500 leading-relaxed mt-0.5">
                                Descuento de ley del 10% por haber votado en las elecciones del 29 de Octubre de 2023.
                              </p>
                            </div>
                          </div>
                          <button
                            onClick={() => setDescuentos(prev => ({ ...prev, electoral: !prev.electoral }))}
                            className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                              descuentos.electoral ? 'bg-green-600' : 'bg-slate-300'
                            }`}
                          >
                            <span
                              className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${
                                descuentos.electoral ? 'translate-x-5' : 'translate-x-0'
                              }`}
                            />
                          </button>
                        </div>
                      </div>
                      {/* Sub-section: Agreements */}
                      <div className="p-4 rounded-2xl border border-slate-200/80 bg-slate-50/50">
                        <div className="flex items-center gap-2.5 mb-3.5">
                          <span className="text-2xl">📋</span>
                          <h3 className="font-semibold text-slate-800 text-sm sm:text-base">
                            Convenios Interinstitucionales
                          </h3>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                          <button
                            onClick={() => setDescuentos(prev => ({ ...prev, convenio: 0 }))}
                            className={`p-2.5 rounded-xl border text-center transition duration-200 text-xs font-semibold ${
                              descuentos.convenio === 0
                                ? 'border-unad-blue bg-unad-blue text-white'
                                : 'border-slate-200 bg-white hover:border-slate-300 text-slate-600'
                            }`}
                          >
                            Sin Convenio
                          </button>
                          <button
                            onClick={() => setDescuentos(prev => ({ ...prev, convenio: 5 }))}
                            className={`p-2.5 rounded-xl border text-center transition duration-200 text-xs font-semibold ${
                              descuentos.convenio === 5
                                ? 'border-unad-blue bg-unad-blue text-white'
                                : 'border-slate-200 bg-white hover:border-slate-300 text-slate-600'
                            }`}
                          >
                            Alianza 5%
                          </button>
                          <button
                            onClick={() => setDescuentos(prev => ({ ...prev, convenio: 10 }))}
                            className={`p-2.5 rounded-xl border text-center transition duration-200 text-xs font-semibold ${
                              descuentos.convenio === 10
                                ? 'border-unad-blue bg-unad-blue text-white'
                                : 'border-slate-200 bg-white hover:border-slate-300 text-slate-600'
                            }`}
                          >
                            Alianza 10%
                          </button>
                          <button
                            onClick={() => setDescuentos(prev => ({ ...prev, convenio: 15 }))}
                            className={`p-2.5 rounded-xl border text-center transition duration-200 text-xs font-semibold ${
                              descuentos.convenio === 15
                                ? 'border-unad-blue bg-unad-blue text-white'
                                : 'border-slate-200 bg-white hover:border-slate-300 text-slate-600'
                            }`}
                          >
                            Alianza 15%
                          </button>
                          {/* Level-specific discounts */}
                          {esPosgrado ? (
                            <React.Fragment>
                              <button
                                onClick={() => setDescuentos(prev => ({ ...prev, convenio: 30 }))}
                                className={`p-2.5 rounded-xl border text-center transition duration-200 text-xs font-semibold flex flex-col justify-center items-center gap-0.5 ${
                                  descuentos.convenio === 30
                                    ? 'border-unad-blue bg-unad-blue text-white'
                                    : 'border-slate-200 bg-white hover:border-slate-300 text-slate-600'
                                }`}
                              >
                                <span>Egresado UNAD</span>
                                <span className={`text-[10px] ${descuentos.convenio === 30 ? 'text-unad-yellow' : 'text-slate-400'}`}>30% Descuento</span>
                              </button>
                              
                              <button
                                onClick={() => setDescuentos(prev => ({ ...prev, convenio: 25 }))}
                                className={`p-2.5 rounded-xl border text-center transition duration-200 text-xs font-semibold flex flex-col justify-center items-center gap-0.5 ${
                                  descuentos.convenio === 25
                                    ? 'border-unad-blue bg-unad-blue text-white'
                                    : 'border-slate-200 bg-white hover:border-slate-300 text-slate-600'
                                }`}
                              >
                                <span>Militares/Uniformados</span>
                                <span className={`text-[10px] ${descuentos.convenio === 25 ? 'text-unad-yellow' : 'text-slate-400'}`}>25% Descuento</span>
                              </button>
                            </React.Fragment>
                          ) : (
                            <button
                              onClick={() => setDescuentos(prev => ({ ...prev, convenio: 40 }))}
                              className={`p-2.5 rounded-xl border text-center transition duration-200 text-xs font-semibold flex flex-col justify-center items-center gap-0.5 col-span-2 ${
                                descuentos.convenio === 40
                                  ? 'border-unad-blue bg-unad-blue text-white'
                                  : 'border-slate-200 bg-white hover:border-slate-300 text-slate-600'
                              }`}
                            >
                              <span>Fuerzas Militares Activos / Uniformados</span>
                              <span className={`text-[10px] ${descuentos.convenio === 40 ? 'text-unad-yellow font-bold' : 'text-green-600 font-medium'}`}>40% Especial</span>
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                    {/* Dynamic Savings Info */}
                    <div className="mt-4 p-3.5 bg-sky-50 border border-sky-100 rounded-2xl flex items-start gap-2.5">
                      <span className="text-sky-600 text-base mt-0.5">ℹ️</span>
                      <p className="text-xs text-sky-900 leading-normal">
                        <strong>Descuentos acumulables:</strong> El descuento electoral (10%) y el convenio institucional seleccionado se aplicarán conjuntamente sobre el valor neto de los créditos.
                        {descuentos.electoral || descuentos.convenio > 0 ? (
                          <span className="block mt-1 font-semibold text-green-700">
                            ¡Tienes un {resultado.porcentajeDescuento}% de descuento total en créditos activo!
                          </span>
                        ) : null}
                      </p>
                    </div>
                  </section>
                </div>
                {/* Right Column: Liquidación Receipt & Extras (5 Cols on large screen) */}
                <div className="lg:col-span-5 space-y-6">
                  {/* The Liquidación Receipt */}
                  <section className="bg-unad-navy text-white rounded-3xl shadow-xl overflow-hidden print-card relative">
                    {/* Watermark Logo */}
                    <div className="absolute right-0 bottom-0 opacity-5 pointer-events-none translate-x-12 translate-y-12">
                      <svg className="w-64 h-64" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                      </svg>
                    </div>
                    <div className="bg-gradient-to-r from-unad-blue to-blue-950 p-6 border-b border-white/10 flex items-center justify-between">
                      <div>
                        <h2 className="text-xl font-bold font-title text-white">Liquidación</h2>
                        <p className="text-[11px] text-slate-300">Periodo Académico Vigente</p>
                      </div>
                      <span className="text-xs font-semibold bg-unad-yellow text-unad-blue px-3 py-1 rounded-full shadow-md">
                        {programaActual.nombre.split(' ')[0]}
                      </span>
                    </div>
                    <div className="p-6 space-y-5">
                      <div className="space-y-3">
                        <div className="flex justify-between items-center text-sm">
                          <span className="text-slate-300">Créditos ({creditos} × ${programaActual.creditoValor.toLocaleString()})</span>
                          <span className="font-semibold text-white">${resultado.subtotalCreditos.toLocaleString()}</span>
                        </div>
                        <div className="flex justify-between items-center text-sm">
                          <span className="text-slate-300">Derechos de Inscripción</span>
                          <span className="font-semibold text-white">${resultado.inscripcion.toLocaleString()}</span>
                        </div>
                        <div className="flex justify-between items-center text-sm">
                          <span className="text-slate-300">Seguro Estudiantil</span>
                          <span className="font-semibold text-white">${resultado.seguro.toLocaleString()}</span>
                        </div>
                      </div>
                      {/* Divider */}
                      <div className="border-t border-white/10 my-2"></div>
                      {/* Discounts segment */}
                      {resultado.descuentoAplicado > 0 ? (
                        <div className="bg-emerald-950/30 border border-emerald-500/20 rounded-2xl p-3.5 space-y-1">
                          <div className="flex justify-between items-center text-emerald-400 font-semibold text-sm">
                            <span>Descuento Aplicado ({resultado.porcentajeDescuento}%)</span>
                            <span>-${resultado.descuentoAplicado.toLocaleString()}</span>
                          </div>
                          <div className="text-[10px] text-emerald-300/80 leading-normal">
                            Ahorro por: {resultado.descuentosAplicados.join(' + ')}
                          </div>
                        </div>
                      ) : (
                        <div className="bg-white/5 rounded-2xl p-3 text-center text-xs text-slate-400 font-light">
                          No has seleccionado ningún descuento.
                        </div>
                      )}
                      {/* Visual Cost Proportions Bar Chart */}
                      <div className="space-y-1.5 no-print">
                        <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400">Distribución de Costos</span>
                        <div className="w-full h-3 bg-white/10 rounded-full overflow-hidden flex">
                          <div
                            style={{ width: `${creditsPct}%` }}
                            className="bg-sky-500 transition-all duration-300"
                            title={`Créditos: ${creditsPct.toFixed(0)}%`}
                          ></div>
                          <div
                            style={{ width: `${feesPct}%` }}
                            className="bg-unad-yellow transition-all duration-300"
                            title={`Inscripción y Seguro: ${feesPct.toFixed(0)}%`}
                          ></div>
                        </div>
                        <div className="flex gap-4 text-[10px] text-slate-300 font-medium">
                          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-sky-500"></span> Créditos</span>
                          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-unad-yellow"></span> Trámites</span>
                        </div>
                      </div>
                      {/* Total section */}
                      <div className="border-t-2 border-dashed border-white/20 pt-4 flex flex-col items-center">
                        <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Total Proyectado a Pagar</span>
                        <span className="text-3xl sm:text-4xl font-extrabold text-unad-yellow tracking-tight mt-1 font-title">
                          ${resultado.total.toLocaleString()}
                        </span>
                        <span className="text-[10px] text-slate-400 mt-1 font-light italic">Pesos Colombianos (COP)</span>
                      </div>
                      {/* Ahorro total banner */}
                      {resultado.descuentoAplicado > 0 && (
                        <div className="bg-gradient-to-r from-emerald-500/20 to-teal-500/20 border border-emerald-500/30 rounded-2xl p-3.5 text-center text-sm font-medium text-emerald-300 flex items-center justify-center gap-2">
                          <span>🎉</span>
                          <span>¡Te estás ahorrando <strong>${resultado.descuentoAplicado.toLocaleString()} COP</strong>!</span>
                        </div>
                      )}
                      {/* Buttons: PDF and Copy (Hidden when printing) */}
                      <div className="grid grid-cols-2 gap-3 no-print pt-2">
                        <button
                          onClick={handleCopySummary}
                          className={`py-3 px-4 text-xs font-semibold rounded-2xl transition duration-200 flex items-center justify-center gap-2 ${
                            copySuccess
                              ? 'bg-emerald-600 text-white'
                              : 'bg-white/10 hover:bg-white/15 text-white border border-white/15'
                          }`}
                        >
                          {copySuccess ? (
                            <React.Fragment>
                              <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                              </svg>
                              <span>¡Copiado!</span>
                            </React.Fragment>
                          ) : (
                            <React.Fragment>
                              <svg className="w-4 h-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                              </svg>
                              <span>Copiar resumen</span>
                            </React.Fragment>
                          )}
                        </button>
                        <button
                          onClick={handlePrint}
                          className="py-3 px-4 text-xs font-semibold rounded-2xl bg-unad-yellow hover:bg-yellow-400 text-unad-blue transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-unad-yellow/10"
                        >
                          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                          </svg>
                          <span>Imprimir recibo</span>
                        </button>
                      </div>
                    </div>
                  </section>
                  {/* Requirements Tracker */}
                  <section className="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/80 hover:border-slate-300 transition duration-200">
                    <div className="flex items-center justify-between gap-3 mb-3">
                      <h3 className="font-bold text-unad-blue font-title text-base sm:text-lg flex items-center gap-2">
                        <span>📋</span>
                        Requisitos de Inscripción
                      </h3>
                      <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">
                        {docsCheckedCount}/{listaRequisitos.length} listos
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 mb-4">
                      Requisitos requeridos para formalizar tu matrícula como estudiante de <strong>{esPosgrado ? 'Posgrado' : 'Pregrado'}</strong>. Marca los que ya poseas:
                    </p>
                    {/* Progress bar */}
                    <div className="w-full bg-slate-100 rounded-full h-1.5 mb-4 overflow-hidden">
                      <div
                        style={{ width: `${pctDocs}%` }}
                        className="bg-emerald-500 h-1.5 rounded-full transition-all duration-300"
                      ></div>
                    </div>
                    <ul className="space-y-2.5">
                      {listaRequisitos.map((req) => {
                        const isChecked = !!checklistDocs[req.id];
                        return (
                          <li
                            key={req.id}
                            onClick={() => handleChecklistChange(req.id)}
                            className={`flex items-start gap-3 p-2.5 rounded-xl border cursor-pointer select-none transition duration-150 ${
                              isChecked
                                ? 'border-emerald-200 bg-emerald-50/35 text-slate-800'
                                : 'border-slate-100 bg-slate-50/20 text-slate-600 hover:border-slate-200'
                            }`}
                          >
                            <span className={`flex-shrink-0 w-5 h-5 rounded-md border flex items-center justify-center transition duration-150 ${
                              isChecked ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'
                            }`}>
                              {isChecked && (
                                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                                </svg>
                              )}
                            </span>
                            <span className={`text-xs leading-normal ${isChecked ? 'line-through text-slate-400' : ''}`}>
                              {req.text}
                            </span>
                          </li>
                        );
                      })}
                    </ul>
                  </section>
                </div>
                {/* FAQ and Helpful Accordion (Full width bottom - no print) */}
                <div className="col-span-12 space-y-4 no-print mt-4 sm:mt-6">
                  <h3 className="text-xl font-bold font-title text-unad-blue">Preguntas Frecuentes</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {faqs.map((faq, idx) => {
                      const isOpen = activeFaq === idx;
                      return (
                        <div
                          key={idx}
                          className="bg-white rounded-2xl border border-slate-200/80 overflow-hidden hover:border-slate-300 transition duration-150"
                        >
                          <button
                            onClick={() => setActiveFaq(isOpen ? null : idx)}
                            className="w-full p-4 text-left font-semibold text-sm sm:text-base text-unad-blue flex items-center justify-between gap-4 focus:outline-none"
                          >
                            <span>{faq.q}</span>
                            <span className={`text-xs transform transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}>
                              ▼
                            </span>
                          </button>
                          {isOpen && (
                            <div className="p-4 pt-0 text-xs sm:text-sm text-slate-600 border-t border-slate-100 leading-relaxed bg-slate-50/20">
                              {faq.a}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </main>
              {/* Bottom Footer */}
              <footer className="bg-slate-100 border-t border-slate-200 py-6 px-4 mt-12 text-center text-xs text-slate-500 no-print">
                <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                  <p>Universidad Nacional Abierta y a Distancia (UNAD). Colombia © {new Date().getFullYear()}</p>
                  <p className="font-light">Diseñado con propósitos de simulación y proyección de matrículas</p>
                </div>
              </footer>
            </div>
          );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SimuladorMatricula />);
    </script>
</body>
</html>
