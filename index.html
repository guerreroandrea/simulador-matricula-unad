<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Matrícula UNAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            unad: {
              blue: '#002F6C',
              navy: '#001E44',
              yellow: '#F2B705',
              gold: '#D19A02',
              lightBlue: '#E6F0FA',
              sky: '#0070F3'
            }
          },
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif']
          },
          screens: {
            'xs': '400px',
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .font-title { font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 9999px; background: #e2e8f0; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #002F6C; cursor: pointer; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #002F6C; cursor: pointer; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      .print-only { display: block !important; }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased pb-28 lg:pb-0">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ─── Íconos SVG compactos ─── */
    const IconLaptop = () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>;
    const IconBook = () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>;
    const IconGrad = () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 14l9-5-9-5-9 5 9 5zm0 0v7M3 12v5a9 9 0 0018 0v-5"/></svg>;
    const IconBuilding = () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg>;
    const IconDoc = () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>;
    const IconCheck = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7"/></svg>;
    const IconCopy = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>;
    const IconPrint = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>;

    /* ─── Datos ─── */
    const programas = {
      tecnologia: { nombre: 'Tecnologías', nivel: 'pregrado', creditoValor: 152000, inscripcion: 245000, seguro: 10000, creditosDefault: 15, maxCreditos: 18, minCreditos: 1, icon: <IconLaptop />, desc: 'Formación tecnológica superior.' },
      pregrado:   { nombre: 'Profesional (Pregrados)', nivel: 'pregrado', creditoValor: 170000, inscripcion: 245000, seguro: 10000, creditosDefault: 15, maxCreditos: 21, minCreditos: 1, icon: <IconBook />, desc: 'Carreras profesionales universitarias.' },
      especializacion: { nombre: 'Especializaciones', nivel: 'posgrado', creditoValor: 598000, inscripcion: 390000, seguro: 10000, creditosDefault: 12, maxCreditos: 15, minCreditos: 1, icon: <IconGrad />, desc: 'Posgrados de especialización.' },
      maestria:   { nombre: 'Maestrías', nivel: 'posgrado', creditoValor: 925000, inscripcion: 390000, seguro: 10000, creditosDefault: 12, maxCreditos: 12, minCreditos: 1, icon: <IconBuilding />, desc: 'Estudios avanzados de maestría.' },
      doctorado:  { nombre: 'Doctorado', nivel: 'posgrado', creditoValor: 1032000, inscripcion: 390000, seguro: 10000, creditosDefault: 12, maxCreditos: 12, minCreditos: 1, icon: <IconDoc />, desc: 'Programas de doctorado.' },
    };

    const requisitosMap = {
      pregrado: [
        { id: 'dip', text: 'Copia del Diploma de Bachiller' },
        { id: 'act', text: 'Acta de grado de bachiller autenticada' },
        { id: 'icf', text: 'Resultado de Pruebas Saber 11 (ICFES)' },
        { id: 'doc', text: 'Documento de identidad ampliado al 150%' },
        { id: 'fot', text: '2 fotos 3x4 fondo blanco' },
        { id: 'des', text: 'Soportes de descuento originales (si aplica)' },
      ],
      posgrado: [
        { id: 'dipp', text: 'Fotocopia del Diploma de Pregrado' },
        { id: 'actp', text: 'Acta de Grado de Pregrado autenticada' },
        { id: 'hv',   text: 'Hoja de vida actualizada' },
        { id: 'docp', text: 'Documento de Identidad ampliado al 150%' },
        { id: 'fotp', text: 'Dos fotos 3×4 fondo blanco' },
        { id: 'desp', text: 'Soportes de descuento (si aplica)' },
      ],
    };

    const faqs = [
      { q: '¿Cómo se acumulan los descuentos?', a: 'El descuento electoral (10%) y los convenios interinstitucionales son acumulables. Por ejemplo, 10% electoral + 15% convenio = 25% total sobre el valor de los créditos.' },
      { q: '¿Qué vigencia tiene el descuento electoral?', a: 'Se exige el certificado electoral de las últimas votaciones nacionales vigentes (29 de octubre de 2023). Otorga un 10% de descuento.' },
      { q: '¿El descuento aplica sobre inscripción y seguro?', a: 'No. Los descuentos se aplican exclusivamente sobre el costo de los créditos académicos. La inscripción y el seguro estudiantil se cobran en su totalidad.' },
      { q: '¿Cuáles son las opciones de financiación?', a: 'La UNAD ofrece financiación directa, ICETEX, Cooptraiss, Fincomercio, Banco Pichincha, y pagos con tarjeta de crédito de cualquier entidad bancaria.' },
    ];

    /* ─── Componente Toggle ─── */
    const Toggle = ({ value, onChange }) => (
      <button
        onClick={onChange}
        role="switch"
        aria-checked={value}
        className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-unad-blue focus:ring-offset-2 ${value ? 'bg-green-500' : 'bg-slate-300'}`}
      >
        <span className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow transition duration-200 ${value ? 'translate-x-5' : 'translate-x-0'}`} />
      </button>
    );

    /* ─── App principal ─── */
    const SimuladorMatricula = () => {
      const [tipoPrograma, setTipoPrograma] = useState('pregrado');
      const [creditos, setCreditos] = useState(15);
      const [descuentos, setDescuentos] = useState({ electoral: false, convenio: 0 });
      const [checklistDocs, setChecklistDocs] = useState({});
      const [copySuccess, setCopySuccess] = useState(false);
      const [activeFaq, setActiveFaq] = useState(null);

      const prog = programas[tipoPrograma];
      const esPosgrado = prog.nivel === 'posgrado';
      const listaReqs = esPosgrado ? requisitosMap.posgrado : requisitosMap.pregrado;

      useEffect(() => {
        setCreditos(prog.creditosDefault);
        setChecklistDocs({});
      }, [tipoPrograma]);

      useEffect(() => {
        if (esPosgrado && descuentos.convenio === 40) setDescuentos(d => ({ ...d, convenio: 25 }));
        if (!esPosgrado && (descuentos.convenio === 30 || descuentos.convenio === 25)) setDescuentos(d => ({ ...d, convenio: 0 }));
      }, [tipoPrograma]);

      /* ─── Cálculo ─── */
      const subtotalCreditos = creditos * prog.creditoValor;
      const subtotal = subtotalCreditos + prog.inscripcion + prog.seguro;
      let pctDesc = 0;
      const descLabels = [];
      if (descuentos.electoral) { pctDesc += 10; descLabels.push('Electoral 10%'); }
      if (descuentos.convenio > 0) {
        pctDesc += descuentos.convenio;
        const labels = { 5: 'Alianza 5%', 10: 'Alianza 10%', 15: 'Alianza 15%', 25: 'Militares 25%', 30: 'Egresado UNAD 30%', 40: 'Militares 40%' };
        descLabels.push(labels[descuentos.convenio] || `Convenio ${descuentos.convenio}%`);
      }
      const descuentoAplicado = Math.round((subtotalCreditos * pctDesc) / 100);
      const total = subtotal - descuentoAplicado;
      const creditsPct = subtotalCreditos > 0 ? ((subtotalCreditos / (subtotalCreditos + prog.inscripcion + prog.seguro)) * 100).toFixed(1) : 0;

      /* ─── Checklist ─── */
      const docsDone = Object.values(checklistDocs).filter(Boolean).length;
      const pctDocs = Math.round((docsDone / listaReqs.length) * 100);

      /* ─── Acciones ─── */
      const handleCopy = () => {
        const txt = `--- SIMULACIÓN MATRÍCULA UNAD ---\nPrograma: ${prog.nombre}\nCréditos: ${creditos} ($${(creditos * prog.creditoValor).toLocaleString()} COP)\nInscripción: $${prog.inscripcion.toLocaleString()} COP\nSeguro: $${prog.seguro.toLocaleString()} COP\nDescuento: ${pctDesc}% (-$${descuentoAplicado.toLocaleString()} COP)\n${descLabels.length ? 'Descuentos: ' + descLabels.join(' + ') + '\n' : ''}---\nTOTAL: $${total.toLocaleString()} COP\nSimulado el ${new Date().toLocaleDateString()}\n---`;
        navigator.clipboard.writeText(txt).then(() => { setCopySuccess(true); setTimeout(() => setCopySuccess(false), 3000); });
      };

      /* ─── Botones de convenio ─── */
      const conveniosBase = [
        { val: 0,  label: 'Sin convenio', sub: null },
        { val: 5,  label: 'Alianza', sub: '5%' },
        { val: 10, label: 'Alianza', sub: '10%' },
        { val: 15, label: 'Alianza', sub: '15%' },
      ];
      const conveniosExtra = esPosgrado
        ? [{ val: 30, label: 'Egresado UNAD', sub: '30%' }, { val: 25, label: 'Militares', sub: '25%' }]
        : [{ val: 40, label: 'Militares activos', sub: '40% especial' }];
      const todosConvenios = [...conveniosBase, ...conveniosExtra];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Barra decorativa superior */}
          <div className="h-1.5 bg-gradient-to-r from-unad-blue via-unad-yellow to-yellow-400 no-print" />

          {/* Header */}
          <header className="bg-unad-blue text-white shadow-lg py-3 px-4 sm:px-6 no-print">
            <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="bg-white/10 p-2 rounded-xl border border-white/20 flex-shrink-0">
                  <svg className="w-7 h-7 text-unad-yellow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-lg sm:text-2xl font-extrabold tracking-tight font-title text-white leading-none">
                    UNAD <span className="text-unad-yellow font-medium text-base sm:text-lg px-1.5 py-0.5 rounded-lg bg-white/10 border border-white/10">Simulador</span>
                  </h1>
                  <p className="text-[10px] sm:text-xs text-slate-300 font-light mt-0.5">Liquidación proyectada de Matrícula Universitaria</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => { setTipoPrograma('pregrado'); setCreditos(15); setDescuentos({ electoral: false, convenio: 0 }); setChecklistDocs({}); }}
                  className="px-3 py-1.5 text-xs font-semibold rounded-xl text-slate-200 bg-white/5 border border-white/10 hover:bg-white/10 transition">
                  Reiniciar
                </button>
                <a href="https://www.unad.edu.co" target="_blank" rel="noopener noreferrer"
                  className="px-3 py-1.5 text-xs font-semibold rounded-xl text-unad-blue bg-unad-yellow hover:bg-yellow-400 shadow-md transition">
                  Sitio UNAD
                </a>
              </div>
            </div>
          </header>

          {/* Encabezado solo para impresión */}
          <div className="hidden print-only p-6 border-b-2 border-unad-blue">
            <h1 className="text-2xl font-bold text-unad-blue">UNIVERSIDAD NACIONAL ABIERTA Y A DISTANCIA (UNAD)</h1>
            <p className="text-sm text-slate-500 mt-1">Simulación de Matrícula — {new Date().toLocaleDateString()} {new Date().toLocaleTimeString()}</p>
          </div>

          {/* Main */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 md:px-8 lg:px-10">
            
            {/* ═══ Columna izquierda: controles ═══ */}
            <div className="lg:col-span-7 space-y-4 sm:space-y-6 no-print">

              {/* Paso 1: Programa */}
              <section className="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80">
                <h2 className="text-base sm:text-lg font-bold font-title text-unad-blue mb-4 flex items-center gap-2">
                  <span className="w-6 h-6 rounded-lg bg-unad-blue/5 text-unad-blue text-xs font-bold flex items-center justify-center flex-shrink-0">1</span>
                  Programa Académico
                </h2>
                {/* 2 columnas siempre para las tarjetas de programa */}
                <div className="grid grid-cols-2 gap-2 sm:gap-3">
                  {Object.entries(programas).map(([key, p]) => {
                    const sel = tipoPrograma === key;
                    return (
                      <button key={key} onClick={() => setTipoPrograma(key)}
                        className={`p-3 sm:p-4 rounded-xl border text-left flex flex-col gap-2 transition-all duration-200 ${sel ? 'border-unad-blue bg-blue-50/50 shadow-sm ring-2 ring-unad-blue/15' : 'border-slate-200 hover:border-blue-200 hover:bg-slate-50'}`}>
                        <div className="flex items-center gap-2">
                          <div className={`p-1.5 rounded-lg flex-shrink-0 ${sel ? 'bg-unad-blue text-white' : 'bg-slate-100 text-slate-500'}`}>
                            {p.icon}
                          </div>
                          {sel && <span className="text-[9px] uppercase font-bold tracking-wider text-unad-blue bg-unad-lightBlue px-1.5 py-0.5 rounded-full ml-auto">Activo</span>}
                        </div>
                        <div>
                          <p className={`font-semibold text-xs sm:text-sm leading-snug ${sel ? 'text-unad-blue' : 'text-slate-800'}`}>{p.nombre}</p>
                          <p className="text-[10px] text-slate-400 mt-0.5 hidden sm:block">{p.desc}</p>
                          <p className={`text-xs font-bold mt-1 ${sel ? 'text-unad-blue' : 'text-slate-600'}`}>
                            ${p.creditoValor.toLocaleString()}<span className="font-normal text-slate-400 text-[10px]">/cr.</span>
                          </p>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </section>

              {/* Paso 2: Créditos */}
              <section className="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80">
                <div className="flex items-center justify-between gap-3 mb-3">
                  <h2 className="text-base sm:text-lg font-bold font-title text-unad-blue flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-unad-blue/5 text-unad-blue text-xs font-bold flex items-center justify-center flex-shrink-0">2</span>
                    Créditos Académicos
                  </h2>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <span className="text-xs text-slate-500 hidden sm:inline">Cantidad:</span>
                    <input type="number" value={creditos}
                      onChange={e => { const v = parseInt(e.target.value) || 0; if (v >= 0 && v <= 40) setCreditos(v); }}
                      className="w-16 p-1.5 font-bold text-center border-2 border-slate-200 rounded-lg focus:border-unad-blue focus:outline-none text-sm text-unad-blue"
                      min="1" max="40" />
                  </div>
                </div>

                <p className="text-xs text-slate-500 mb-3">
                  Rango regular: <strong>{prog.minCreditos}–{prog.maxCreditos} créditos</strong> por período. Puedes escribir directamente para simular casos especiales.
                </p>

                <input type="range" min="1" max="35"
                  value={creditos > 35 ? 35 : creditos < 1 ? 1 : creditos}
                  onChange={e => setCreditos(parseInt(e.target.value) || 1)}
                  className="w-full mb-2" />

                <div className="flex justify-between text-xs text-slate-400">
                  <span>1 cr.</span>
                  <span className="text-unad-blue font-semibold bg-unad-lightBlue px-2 py-0.5 rounded-full text-[10px]">
                    Regular: {prog.minCreditos}–{prog.maxCreditos} cr.
                  </span>
                  <span>35 cr.</span>
                </div>

                {(creditos < prog.minCreditos || creditos > prog.maxCreditos) && creditos > 0 && (
                  <div className="mt-3 p-2.5 bg-amber-50 border border-amber-200 rounded-xl flex items-start gap-2 text-xs text-amber-800">
                    <span className="flex-shrink-0 mt-0.5">⚠️</span>
                    <span>{creditos} créditos está fuera del rango regular ({prog.minCreditos}–{prog.maxCreditos} cr.).</span>
                  </div>
                )}
              </section>

              {/* Paso 3: Descuentos */}
              <section className="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80">
                <h2 className="text-base sm:text-lg font-bold font-title text-unad-blue mb-1 flex items-center gap-2">
                  <span className="w-6 h-6 rounded-lg bg-unad-blue/5 text-unad-blue text-xs font-bold flex items-center justify-center flex-shrink-0">3</span>
                  Descuentos y Beneficios
                </h2>
                <p className="text-xs text-slate-500 mb-4">Los descuentos son acumulables y aplican sobre el valor de los créditos académicos.</p>

                {/* Electoral */}
                <div className="p-3 sm:p-4 rounded-xl border border-slate-200 bg-slate-50/50 mb-3">
                  <div className="flex items-center justify-between gap-3">
                    <div className="flex items-start gap-2.5 min-w-0">
                      <span className="text-xl flex-shrink-0">🗳️</span>
                      <div className="min-w-0">
                        <p className="font-semibold text-slate-800 text-sm">Certificado Electoral Vigente</p>
                        <p className="text-xs text-slate-500 mt-0.5 leading-relaxed">10% de descuento — elecciones del 29 Oct 2023.</p>
                      </div>
                    </div>
                    <Toggle value={descuentos.electoral} onChange={() => setDescuentos(d => ({ ...d, electoral: !d.electoral }))} />
                  </div>
                </div>

                {/* Convenios */}
                <div className="p-3 sm:p-4 rounded-xl border border-slate-200 bg-slate-50/50">
                  <div className="flex items-center gap-2 mb-3">
                    <span className="text-xl">📋</span>
                    <h3 className="font-semibold text-slate-800 text-sm">Convenios Interinstitucionales</h3>
                  </div>
                  {/* Grid adaptivo: 2 cols en móvil, más en desktop */}
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {todosConvenios.map(({ val, label, sub }) => {
                      const sel = descuentos.convenio === val;
                      return (
                        <button key={val} onClick={() => setDescuentos(d => ({ ...d, convenio: val }))}
                          className={`p-2.5 rounded-xl border text-center transition duration-200 flex flex-col items-center justify-center gap-0.5 min-h-[52px] ${sel ? 'border-unad-blue bg-unad-blue text-white' : 'border-slate-200 bg-white hover:border-blue-200 text-slate-600'}`}>
                          <span className="text-xs font-semibold leading-tight">{label}</span>
                          {sub && <span className={`text-[10px] font-bold ${sel ? 'text-unad-yellow' : 'text-green-600'}`}>{sub}</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Info acumulación */}
                <div className="mt-3 p-3 bg-sky-50 border border-sky-100 rounded-xl flex items-start gap-2">
                  <span className="text-sky-600 text-sm mt-0.5 flex-shrink-0">ℹ️</span>
                  <p className="text-xs text-sky-900 leading-relaxed">
                    <strong>Descuentos acumulables</strong> sobre el valor de créditos.
                    {pctDesc > 0 && <span className="block mt-0.5 font-bold text-green-700">¡Tienes {pctDesc}% de descuento total activo!</span>}
                  </p>
                </div>
              </section>
            </div>

            {/* ═══ Columna derecha: Recibo + Checklist ═══ */}
            <div id="receipt-section" className="lg:col-span-5 space-y-6 self-start scroll-mt-6 w-full">

              {/* Recibo de liquidación */}
              <section className="bg-unad-navy text-white rounded-3xl shadow-xl overflow-hidden print-card relative w-full">
                {/* Watermark */}
                <div className="absolute right-0 bottom-0 opacity-5 pointer-events-none translate-x-10 translate-y-10 hidden sm:block">
                  <svg className="w-48 h-48" fill="currentColor" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>

                {/* Header del recibo */}
                <div className="bg-gradient-to-r from-unad-blue to-blue-950 p-4 sm:p-5 border-b border-white/10 flex items-center justify-between">
                  <div>
                    <h2 className="text-base sm:text-lg font-bold font-title text-white">Liquidación</h2>
                    <p className="text-[10px] text-slate-300">Período Académico Vigente</p>
                  </div>
                  <span className="text-xs font-bold bg-unad-yellow text-unad-blue px-3 py-1 rounded-full shadow">
                    {prog.nombre.split(' ')[0]}
                  </span>
                </div>

                <div className="p-4 sm:p-5 space-y-4">
                  {/* Ítems de costo */}
                  <div className="space-y-2.5">
                    <div className="flex justify-between items-center text-xs sm:text-sm">
                      <span className="text-slate-300">Créditos ({creditos} × ${prog.creditoValor.toLocaleString()})</span>
                      <span className="font-semibold text-white">${subtotalCreditos.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between items-center text-xs sm:text-sm">
                      <span className="text-slate-300">Derechos de Inscripción</span>
                      <span className="font-semibold text-white">${prog.inscripcion.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between items-center text-xs sm:text-sm">
                      <span className="text-slate-300">Seguro Estudiantil</span>
                      <span className="font-semibold text-white">${prog.seguro.toLocaleString()}</span>
                    </div>
                  </div>

                  <div className="border-t border-white/10" />

                  {/* Descuento */}
                  {descuentoAplicado > 0 ? (
                    <div className="bg-emerald-950/40 border border-emerald-500/25 rounded-xl p-3 space-y-1">
                      <div className="flex justify-between items-center text-emerald-400 font-semibold text-xs sm:text-sm">
                        <span>Descuento ({pctDesc}%)</span>
                        <span>-${descuentoAplicado.toLocaleString()}</span>
                      </div>
                      <p className="text-[10px] text-emerald-300/80">{descLabels.join(' + ')}</p>
                    </div>
                  ) : (
                    <p className="text-center text-xs text-slate-400 py-1">Sin descuentos seleccionados.</p>
                  )}

                  {/* Barra distribución */}
                  <div className="space-y-1.5 no-print">
                    <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400">Distribución de costos</span>
                    <div className="w-full h-2.5 bg-white/10 rounded-full overflow-hidden flex">
                      <div style={{ width: `${creditsPct}%` }} className="bg-sky-500 transition-all duration-500" />
                      <div style={{ width: `${100 - creditsPct}%` }} className="bg-unad-yellow transition-all duration-500" />
                    </div>
                    <div className="flex gap-4 text-[10px] text-slate-300 font-medium">
                      <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-sky-500 inline-block" /> Créditos ({creditsPct}%)</span>
                      <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-unad-yellow inline-block" /> Trámites</span>
                    </div>
                  </div>

                  {/* Total */}
                  <div className="border-t-2 border-dashed border-white/20 pt-4 flex flex-col items-center">
                    <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400">Total Proyectado a Pagar</span>
                    <span className="text-3xl sm:text-4xl font-extrabold text-unad-yellow tracking-tight mt-1 font-title">
                      ${total.toLocaleString()}
                    </span>
                    <span className="text-[10px] text-slate-400 mt-0.5 italic">Pesos Colombianos (COP)</span>
                  </div>

                  {/* Banner ahorro */}
                  {descuentoAplicado > 0 && (
                    <div className="bg-emerald-500/15 border border-emerald-500/30 rounded-xl p-3 text-center text-xs sm:text-sm font-medium text-emerald-300">
                      🎉 ¡Te estás ahorrando <strong>${descuentoAplicado.toLocaleString()} COP</strong>!
                    </div>
                  )}

                  {/* Botones */}
                  <div className="grid grid-cols-2 gap-2.5 no-print pt-1">
                    <button onClick={handleCopy}
                      className={`py-2.5 text-xs font-semibold rounded-xl transition flex items-center justify-center gap-1.5 ${copySuccess ? 'bg-emerald-600 text-white' : 'bg-white/10 hover:bg-white/15 text-white border border-white/15'}`}>
                      {copySuccess ? <><IconCheck /><span>¡Copiado!</span></> : <><IconCopy /><span>Copiar</span></>}
                    </button>
                    <button onClick={() => window.print()}
                      className="py-2.5 text-xs font-semibold rounded-xl bg-unad-yellow hover:bg-yellow-400 text-unad-blue flex items-center justify-center gap-1.5 shadow-md transition">
                      <IconPrint /><span>Imprimir</span>
                    </button>
                  </div>
                </div>
              </section>

              {/* Checklist de requisitos */}
              <section className="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80">
                <div className="flex items-center justify-between gap-2 mb-2">
                  <h3 className="font-bold text-unad-blue font-title text-sm sm:text-base flex items-center gap-2">
                    📋 Requisitos de Inscripción
                  </h3>
                  <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full flex-shrink-0">
                    {docsDone}/{listaReqs.length}
                  </span>
                </div>
                <p className="text-xs text-slate-500 mb-3">
                  Documentos para <strong>{esPosgrado ? 'Posgrado' : 'Pregrado'}</strong>. Toca para marcar los que ya tienes:
                </p>
                {/* Barra de progreso */}
                <div className="w-full bg-slate-100 rounded-full h-1.5 mb-3 overflow-hidden">
                  <div style={{ width: `${pctDocs}%` }} className="bg-emerald-500 h-1.5 rounded-full transition-all duration-300" />
                </div>
                <ul className="space-y-2">
                  {listaReqs.map(req => {
                    const done = !!checklistDocs[req.id];
                    return (
                      <li key={req.id} onClick={() => setChecklistDocs(p => ({ ...p, [req.id]: !p[req.id] }))}
                        className={`flex items-center gap-2.5 p-2.5 rounded-xl border cursor-pointer select-none transition duration-150 ${done ? 'border-emerald-200 bg-emerald-50/40' : 'border-slate-100 bg-slate-50/20 hover:border-slate-200'}`}>
                        <span className={`flex-shrink-0 w-5 h-5 rounded-md border flex items-center justify-center transition ${done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'}`}>
                          {done && <IconCheck />}
                        </span>
                        <span className={`text-xs leading-normal ${done ? 'line-through text-slate-400' : 'text-slate-600'}`}>{req.text}</span>
                      </li>
                    );
                  })}
                </ul>
              </section>
            </div>

            {/* ═══ FAQ — fila completa ═══ */}
            <div className="col-span-1 lg:col-span-12 no-print space-y-3 mt-2">
              <h3 className="text-base sm:text-lg font-bold font-title text-unad-blue">Preguntas Frecuentes</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {faqs.map((faq, i) => {
                  const open = activeFaq === i;
                  return (
                    <div key={i} className="bg-white rounded-xl border border-slate-200/80 overflow-hidden hover:border-slate-300 transition">
                      <button onClick={() => setActiveFaq(open ? null : i)}
                        className="w-full p-3.5 sm:p-4 text-left font-semibold text-xs sm:text-sm text-unad-blue flex items-center justify-between gap-3 focus:outline-none">
                        <span>{faq.q}</span>
                        <span className={`text-xs flex-shrink-0 transition-transform duration-200 ${open ? 'rotate-180' : ''}`}>▼</span>
                      </button>
                      {open && (
                        <div className="px-3.5 sm:px-4 pb-3.5 sm:pb-4 text-xs sm:text-sm text-slate-600 border-t border-slate-100 pt-3 leading-relaxed bg-slate-50/20">
                          {faq.a}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="bg-slate-100 border-t border-slate-200 py-5 px-4 text-center no-print mt-auto">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
              <p>Universidad Nacional Abierta y a Distancia (UNAD). Colombia © {new Date().getFullYear()}</p>
              <p className="font-light">Simulación y proyección de matrículas</p>
            </div>
          </footer>

          {/* ═══ Barra flotante móvil ═══ */}
          <div className="lg:hidden fixed bottom-0 left-0 right-0 bg-unad-navy/96 backdrop-blur-sm text-white border-t border-white/10 px-3 py-3 flex items-center justify-between z-50 shadow-2xl no-print">
            <div className="min-w-0 flex-1 mr-3">
              <span className="text-[9px] text-slate-400 uppercase font-bold tracking-wider block leading-none">Total proyectado · {creditos} cr.</span>
              <div className="flex items-baseline gap-1 mt-0.5">
                <span className="text-lg font-extrabold text-unad-yellow font-title leading-none truncate">${total.toLocaleString()}</span>
                <span className="text-[9px] text-slate-400 italic flex-shrink-0">COP</span>
              </div>
              {pctDesc > 0 && <span className="text-[9px] text-emerald-400 font-semibold">-{pctDesc}% aplicado</span>}
            </div>
            <div className="flex items-center gap-2 flex-shrink-0">
              <a href="#receipt-section" className="bg-white/10 hover:bg-white/15 border border-white/15 text-white text-xs font-semibold px-3 py-2 rounded-xl transition">
                Ver detalle
              </a>
              <button onClick={() => window.print()}
                className="bg-unad-yellow text-unad-blue text-xs font-bold px-3 py-2 rounded-xl hover:bg-yellow-400 transition flex items-center gap-1.5 shadow-md">
                <IconPrint />
                <span>Imprimir</span>
              </button>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<SimuladorMatricula />);
  </script>
</body>
</html>
